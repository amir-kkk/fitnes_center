version: '3.8'

services:
  # ═══ PostgreSQL ═══
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitness_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══ Приложение (ASP.NET Core раздаёт и API, и фронтенд) ═══
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=fitness_db;Username=postgres;Password=postgres
      - JwtSettings__Key=FitnessCenterSuperSecretKeyForJWT2024MustBe32Chars!!
      - JwtSettings__Issuer=FitnessCenter
      - JwtSettings__Audience=FitnessCenterClient
      - JwtSettings__ExpireMinutes=120
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY:-sk-D8q1kVwZgNXTbEM-nQYs3A}
      - DeepSeek__BaseUrl=${DEEPSEEK_BASE_URL:-https://api.artemox.com/v1}
      - DeepSeek__Model=${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - uploads:/app/wwwroot/uploads

volumes:
  pgdata:
  uploads:
